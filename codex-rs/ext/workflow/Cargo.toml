[package]
edition.workspace = true
license.workspace = true
name = "codex-workflow-extension"
version.workspace = true

[lib]
doctest = false
name = "codex_workflow_extension"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-agent-extension = { workspace = true }
codex-code-mode-runtime = { workspace = true }
codex-core = { workspace = true }
codex-extension-api = { workspace = true }
codex-features = { workspace = true }
codex-file-system = { workspace = true }
codex-protocol = { workspace = true }
codex-tools = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-output-truncation = { workspace = true }
codex-utils-path = { workspace = true }
codex-utils-path-uri = { workspace = true }
codex-workflow = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
jsonschema = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
v8 = { workspace = true, features = ["v8_enable_sandbox"] }

[dev-dependencies]
codex-config = { workspace = true }
codex-exec-server = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
